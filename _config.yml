# ==============================================================================
# Jekyll Configuration File (_config.yml)
# ==============================================================================
# Site settings
title: Nirmala Vishwa Vidya Peetham

# Use GFM for Jekyll 3
markdown: GFM

# Enable GitHub Flavored Markdown (GFM) features inside kramdown
# Use kramdown as the primary markdown processor for Jekyll 4
#kramdown:
#  input: GFM                    # Forces the Kramdown engine to use GFM syntax rules
#  syntax_highlighter: rouge    # Matches GitHub's code block styling engine
#  gfm_quirks: [paragraph_end] # Eliminates rendering differences for lists/paragraphs

# ------------------------------------------------------------------------------
# File & Directory Exclusions
# ------------------------------------------------------------------------------
# Only exclude internal development files, automation configs, or non-public docs.
# DO NOT exclude *.pdf or *.xlsx if they are linked/downloaded on the live site!
exclude:
  - Class_TODOs.md          # Internal tasks file
  - .github/                # GitHub Actions workflow directory
  - Gemfile
  - Gemfile.lock


# Disable LSI (Latent Semantic Indexing): If your local builds or action logs run slowly,
# disable LSI in _config.yml since GitHub Pages does not support it anyway:
lsi: false

# Defaults to force page compilation across all Markdown files
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      published: true
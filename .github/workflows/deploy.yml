# ==============================================================================
# Workflow Name: Fast GitHub Pages Deployment (Dual Clean / Incremental Engine)
# Displayed under the "Actions" tab in your GitHub repository.
# ==============================================================================
name: Fast GitHub Pages Deployment

# ------------------------------------------------------------------------------
# Trigger Rules:
# 1. Automatic trigger on git push (Runs as a FULL CLEAN build by default)
# 2. Manual trigger from GitHub Actions UI (Optionally toggle Incremental Mode)
# ------------------------------------------------------------------------------
on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      incremental_build:
        description: "Run as an Incremental Build? (Default is Full Clean)"
        type: boolean
        required: false
        default: false

# ------------------------------------------------------------------------------
# Permissions: Grant the workflow access to read code and deploy to GitHub Pages
# ------------------------------------------------------------------------------
permissions:
  contents: read      # Read repository files and assets
  pages: write         # Deploy built static files to GitHub Pages
  id-token: write      # Secure authentication via OpenID Connect (OIDC)

# ------------------------------------------------------------------------------
# Concurrency: Cancel outdated builds automatically when pushing rapidly
# ------------------------------------------------------------------------------
concurrency:
  group: "pages"
  cancel-in-progress: true  # Aborts old running builds if a new commit arrives

# ==============================================================================
# Jobs Configuration
# ==============================================================================
jobs:

  # ----------------------------------------------------------------------------
  # JOB 1: Parallel Checks & Validation (Runs IN PARALLEL with Job 2)
  # ----------------------------------------------------------------------------
  lint-and-validate:
    runs-on: ubuntu-latest  # Runs on a fresh Linux virtual machine
    steps:
      # Step 1.1: Download only the latest snapshot (skips past Git commit history)
      - name: Checkout Repository (Shallow Clone)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Step 1.2: Place non-blocking tasks here (runs concurrently with the build step)
      - name: Perform Repository Checks
        run: |
          echo "Running parallel checks while the site builds..."
        # Optional: Add markdown linting or link-checker commands here in the future

  # ----------------------------------------------------------------------------
  # JOB 2: Build Site using Jekyll 4 (Evaluates Clean vs. Incremental Mode)
  # ----------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 2.1: Shallow clone the repository to avoid fetching heavy past versions of PDFs/Excel files
      - name: Checkout Repository (Shallow Clone)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Step 2.2: Set up Ruby 3.2 and automatically cache installed Gemfile dependencies
      - name: Setup Ruby and Cache Gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true  # Caches gems installed via Gemfile across runs

      # Step 2.3: Configure GitHub Pages runner environment
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 2.4: Always cache internal Jekyll compilation metadata
      - name: Cache Jekyll Build Metadata
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: ${{ runner.os }}-jekyll-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jekyll-cache-

      # Step 2.5: Conditionally restore/save compiled _site output ONLY when incremental mode is active
      - name: Cache Compiled Site Output (Incremental Mode Only)
        if: ${{ inputs.incremental_build == true }}
        uses: actions/cache@v4
        with:
          path: _site
          key: ${{ runner.os }}-jekyll-site-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jekyll-site-

      # Step 2.6: Execute Jekyll 4 Build based on execution context
      - name: Build with Jekyll 4
        run: |
          if [ "${{ inputs.incremental_build }}" = "true" ]; then
            echo ">>> Executing INCREMENTAL Pass (Fast Differential) <<<"
            JEKYLL_ENV=production bundle exec jekyll build --incremental --source ./ --destination ./_site
          else
            echo ">>> Executing FULL CLEAN Pass (Production Best Practice) <<<"
            JEKYLL_ENV=production bundle exec jekyll build --source ./ --destination ./_site
          fi

      # Step 2.7:  Package and upload built site as an artifact for deployment
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ----------------------------------------------------------------------------
  # JOB 3: Deploy to GitHub Pages (Runs ONLY AFTER 'build' succeeds)
  # ----------------------------------------------------------------------------
  deploy:
    # Requires the 'build' job to complete successfully before executing
    needs: build

    # Target environment for deployment URL tracking
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      # Step 3.1: Publish compiled site artifact straight to GitHub Pages web servers
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5